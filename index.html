<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linea del Tempo Storica — Classe Seconda</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --monarchia:   #8B1A1A;
      --repubblica:  #C0392B;
      --impero-rom:  #D35400;
      --alto-med:    #2471A3;
      --basso-med:   #154360;
      --moderna:     #1A7A3C;
      --contemp:     #0E6655;
      --bizantino:   #B8860B;
      --sacro-rom:   #6C3483;
      --ottomano:    #922B21;
      --bg:          #F4F1EB;
      --card:        #FFFFFF;
      --border:      #DDD6C8;
      --text:        #1A1A1A;
      --muted:       #777;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: #16213E;
      color: #fff;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-shrink: 0;
    }
    .header-icon {
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.12);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
    header p  { font-size: 0.78rem; opacity: 0.6; margin-top: 3px; }

    /* ── PLACEHOLDER ── */
    #placeholder {
      margin: 24px 24px 0;
      background: var(--card);
      border: 1.5px dashed var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex; align-items: center; gap: 10px;
    }
    #placeholder.hidden { display: none; }

    /* ── TIMELINE SCROLL ── */
    .tl-outer {
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      padding: 20px 28px 4px;
      cursor: grab;
      flex-shrink: 0;
    }
    .tl-outer:active { cursor: grabbing; }

    .tl-inner {
      position: relative;
      user-select: none;
    }

    /* ── YEAR AXIS ── */
    .axis {
      position: relative;
      height: 38px;
    }
    .y-mark {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .y-mark .tick       { width: 1px; height: 6px;  background: #CCC; }
    .y-mark .tick.major { height: 12px; background: #999; }
    .y-mark .tick.key   { height: 10px; background: #666; }
    .y-mark .lbl        { font-size: 9.5px; color: #AAA; white-space: nowrap; }
    .y-mark .lbl.major  { font-size: 11px; color: #555; font-weight: 700; }
    .y-mark .lbl.key    { font-size: 10px; color: #777; font-weight: 600; }

    /* Special zero marker */
    .y-mark.zero .tick  { background: #B8860B; height: 14px; width: 2px; }
    .y-mark.zero .lbl   { color: #B8860B; font-weight: 700; font-size: 10px; }

    /* ── TRACK GROUPS ── */
    .group-label {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.09em; color: #AAA; margin: 12px 0 6px;
    }

    .track {
      position: relative; height: 46px; margin-bottom: 7px;
    }

    /* ── EPOCH GROUPING (staffe/graffe) ── */
    .epoch-track { position: relative; height: 48px; margin-bottom: 3px; }

    .epoch-blk {
      position: absolute; top: 0; height: 100%;
      overflow: visible;
    }
    .epoch-blk-name {
      position: absolute; top: 4px;
      left: 0; right: 0; text-align: center;
      font-size: 10.5px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.07em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding: 0 10px;
    }
    /* La staffa: bordo sinistro + fondo + bordo destro, aperta in alto */
    .epoch-blk-bracket {
      position: absolute; bottom: 0;
      left: 8px; right: 8px;
      height: 24px;
      border-left: 2.5px solid currentColor;
      border-bottom: 2.5px solid currentColor;
      border-right: 2.5px solid currentColor;
      border-radius: 0 0 6px 6px;
    }
    /* piedini della staffa (angolini in alto) */
    .epoch-blk-bracket::before,
    .epoch-blk-bracket::after {
      content: '';
      position: absolute; top: 0;
      width: 8px; height: 0;
      border-top: 2.5px solid currentColor;
    }
    .epoch-blk-bracket::before { left: -2.5px; }
    .epoch-blk-bracket::after  { right: -2.5px; }

    /* Epoch background bands (behind main track) */
    .epoch-band {
      position: absolute; top: 0; height: 100%;
      border-radius: 6px; pointer-events: none; z-index: 0;
      opacity: 0.13;
    }

    /* Period segments */
    .period {
      position: absolute; top: 0; height: 100%;
      border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; padding: 0 10px;
      overflow: hidden; z-index: 1;
      transition: filter 0.12s, transform 0.12s, outline 0.12s;
      outline: 2px solid transparent;
      outline-offset: 2px;
    }
    .period:hover { filter: brightness(1.12); transform: scaleY(1.06); z-index: 5; }
    .period.active {
      outline: 3px solid rgba(255,255,255,0.9);
      filter: brightness(1.18);
      z-index: 10;
    }
    .period-lbl {
      font-size: 11.5px; font-weight: 700; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 1px 3px rgba(0,0,0,0.35); pointer-events: none;
    }

    /* Track separator */
    .sep { height: 1px; background: var(--border); margin: 14px 0; }

    /* ── INFO PANEL ── */
    #info-panel {
      margin: 4px 24px 24px;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 6px 30px rgba(0,0,0,0.09);
      overflow: hidden;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    #info-panel.visible {
      opacity: 1; transform: translateY(0); pointer-events: auto;
    }

    .info-head {
      padding: 16px 18px;
      display: flex; align-items: flex-start; gap: 14px;
    }
    .info-bar { width: 5px; border-radius: 3px; align-self: stretch; min-height: 40px; flex-shrink: 0; }
    .info-title    { font-size: 1.05rem; font-weight: 800; }
    .info-subtitle { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .info-close {
      margin-left: auto; background: none; border: none;
      font-size: 1.1rem; cursor: pointer; color: #BBB; padding: 2px 4px;
      line-height: 1; flex-shrink: 0;
      transition: color 0.15s;
    }
    .info-close:hover { color: #666; }

    .info-body {
      padding: 0 18px 18px;
      border-top: 1px solid var(--border);
    }
    .info-desc {
      font-size: 0.875rem; line-height: 1.65; color: #333; margin-top: 14px;
    }
    .info-desc strong { color: #111; }

    .sec-title {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.09em; color: #BBB; margin: 14px 0 8px;
    }

    .events-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .ev-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #F4F1EB; border-radius: 20px; padding: 4px 12px;
      font-size: 0.78rem;
    }
    .ev-chip .yr { font-weight: 700; color: #333; }
    .ev-chip .tx { color: #666; }

    .facts-list { display: flex; flex-direction: column; gap: 7px; }
    .fact {
      font-size: 0.83rem; color: #555; display: flex; gap: 8px; align-items: flex-start;
    }
    .fact::before { content: '→'; flex-shrink: 0; color: #CCC; margin-top: 1px; }

    /* ── LEGEND ── */
    #legend {
      display: flex; flex-wrap: wrap; gap: 7px 14px;
      padding: 0 28px 28px;
    }
    .leg-item {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.75rem; color: #666; cursor: pointer;
      transition: color 0.12s;
    }
    .leg-item:hover { color: #111; }
    .leg-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }

    /* ── SCROLL HINT ── */
    .scroll-hint {
      text-align: center; font-size: 0.72rem; color: #BBB;
      padding: 0 28px 6px; letter-spacing: 0.04em;
    }

    /* ── OGGI BADGE ── */
    .oggi-marker {
      position: absolute; top: 0; z-index: 20; pointer-events: none;
    }
    .oggi-line { width: 2px; background: #E74C3C; position: absolute; top: 0; }
    .oggi-label {
      position: absolute; top: -20px; transform: translateX(-50%);
      background: #E74C3C; color: white;
      font-size: 9px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; white-space: nowrap;
    }

    @media (max-width: 600px) {
      header { padding: 14px 16px; }
      .tl-outer { padding: 16px 16px 4px; }
      #info-panel { margin: 4px 16px 20px; }
      #legend { padding: 0 16px 20px; }
      .period-lbl { font-size: 10px; }
    }
  </style>
</head>

/* ══════════════════════════════════════════════
   DATA — EPOCHE (raggruppamenti superiori)
══════════════════════════════════════════════ */
const EPOCHS = [
  { label: 'Storia Romana',     start: -753, end:  476, color: '#B03020' },
  { label: 'Medioevo',          start:  476, end: 1453, color: '#1A5F8A' },
  { label: 'Età Moderna',       start: 1492, end: 1815, color: '#1A7A3C' },
  { label: 'Età Contemporanea', start: 1815, end: 2026, color: '#0E6655' },
];

/* ══════════════════════════════════════════════
   AXIS DATA
══════════════════════════════════════════════ */
const KEY_DATES = [
  { yr: -753, lbl: '753 a.C.', major: true  },
  { yr: -509, lbl: '509 a.C.', major: false },
  { yr: -264, lbl: '264 a.C.', major: false },
  { yr: -27,  lbl: '27 a.C.',  major: false },
  { yr:  0,   lbl: 'Anno 0',   major: true, zero: true },
  { yr:  395, lbl: '395',      major: false },
  { yr:  476, lbl: '476',      major: true  },
  { yr:  622, lbl: '622',      major: false },
  { yr:  800, lbl: '800',      major: true  },
  { yr: 1000, lbl: '1000',     major: true  },
  { yr: 1096, lbl: '1096',     major: false },
  { yr: 1348, lbl: '1348',     major: false },
  { yr: 1453, lbl: '1453',     major: true  },
  { yr: 1492, lbl: '1492',     major: true  },
  { yr: 1517, lbl: '1517',     major: false },
  { yr: 1789, lbl: '1789',     major: false },
  { yr: 1815, lbl: '1815',     major: true  },
  { yr: 1861, lbl: '1861',     major: false },
  { yr: 1914, lbl: '1914',     major: false },

/* ══════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════ */
function mk(tag, cls, txt) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (txt != null) el.textContent = txt;
  return el;
}

function buildAxis() {
  const ax = mk('div', 'axis');

  // Century ticks (unlabeled)
  for (let y = Math.ceil(CFG.start / 100) * 100; y <= CFG.end; y += 100) {
    if (KEY_DATES.some(k => k.yr === y)) continue; // skip — key date will cover it
    const m = mk('div', 'y-mark');
    m.style.left = x(y) + 'px';
    m.appendChild(mk('div', 'tick'));
    ax.appendChild(m);
  }

  // Key date marks
  KEY_DATES.forEach(kd => {
    const m = mk('div', kd.zero ? 'y-mark zero' : 'y-mark');
    m.style.left = x(kd.yr) + 'px';
    m.appendChild(mk('div', kd.major || kd.zero ? 'tick major' : 'tick key'));
    m.appendChild(mk('div', kd.major || kd.zero ? 'lbl major' : 'lbl key', kd.lbl));
    ax.appendChild(m);
  });

  return ax;
}

function buildEpochTrack() {
  const track = mk('div', 'epoch-track');
  EPOCHS.forEach(ep => {
    const blk     = mk('div', 'epoch-blk');
    blk.style.left  = x(ep.start) + 'px';
    blk.style.width = w(ep.start, ep.end) + 'px';
    blk.style.color = ep.color;

    const name    = mk('div', 'epoch-blk-name', ep.label);
    name.style.color = ep.color;
    const bracket = mk('div', 'epoch-blk-bracket');

    blk.appendChild(name);
    blk.appendChild(bracket);
    track.appendChild(blk);
  });
  return track;
}

function buildTrack(trackId) {
  const track = mk('div', 'track');
  PERIODS.filter(p => p.track === trackId).forEach(p => {
    const el = mk('div', 'period');
    el.id   = 'p-' + p.id;
    el.style.cssText = `left:${x(p.start)}px; width:${w(p.start,p.end)}px; background:${p.color};`;
    el.dataset.id = p.id;
    el.appendChild(mk('span', 'period-lbl', p.label));
    el.addEventListener('click', () => selectPeriod(p.id));
    track.appendChild(el);
  });
  return track;
}

function buildOggiMarker(totalH) {
  const marker = mk('div', 'oggi-marker');
  marker.style.left = x(2026) + 'px';
  const lbl = mk('div', 'oggi-label', 'OGGI');
  const line = mk('div', 'oggi-line');
  line.style.height = totalH + 'px';
  marker.appendChild(lbl);
  marker.appendChild(line);
  return marker;
}

function render() {
  const inner = document.getElementById('tlInner');
  inner.style.width = CFG.totalW + 'px';

  inner.appendChild(buildAxis());

  // Group 1 — epoche (staffe) + periodi principali
  inner.appendChild(mk('div', 'group-label', 'Periodi principali'));
  inner.appendChild(buildEpochTrack());
  inner.appendChild(buildTrack('main'));

  // Separator
  inner.appendChild(mk('div', 'sep'));

  // Group 2 — entità parallele
  inner.appendChild(mk('div', 'group-label', 'Entità parallele'));
  inner.appendChild(buildTrack('par1'));
  inner.appendChild(buildTrack('par2'));
  inner.appendChild(buildTrack('par3'));

  inner.appendChild(buildAxis());

  // Today marker — spans all tracks
  // rough height of content between axes
  const mid = mk('div');
  mid.style.cssText = 'position:absolute;top:38px;pointer-events:none;z-index:30;';
  const approxH = 38 + 18 + 48 + 3 + CFG.trackH + 1 + 14 + 18 + (CFG.trackH + 7) * 3 + 38;
  const line = mk('div');
  line.style.cssText = `position:absolute;left:${x(2026)}px;top:0;width:2px;background:rgba(231,76,60,0.35);height:${approxH}px;`;
  inner.appendChild(line);

  renderLegend();
}

function renderLegend() {
  const leg = document.getElementById('legend');
  PERIODS.forEach(p => {
    const item = mk('div', 'leg-item');
    const dot  = mk('div', 'leg-dot');
    dot.style.background = p.color;
    item.appendChild(dot);
    item.appendChild(mk('span', null, p.label));
    item.addEventListener('click', () => selectPeriod(p.id));
    leg.appendChild(item);
  });
}

/* ══════════════════════════════════════════════
   PANEL
══════════════════════════════════════════════ */
let active = null;

function selectPeriod(id) {
  // deselect previous
  if (active) document.getElementById('p-' + active)?.classList.remove('active');
  if (active === id) { active = null; closePanel(); return; }

  active = id;
  document.getElementById('p-' + id)?.classList.add('active');

  const p = PERIODS.find(p => p.id === id);
  if (!p) return;
  showPanel(p);
}

function showPanel(p) {
  document.getElementById('placeholder').classList.add('hidden');
  document.getElementById('infoBar').style.background   = p.color;
  document.getElementById('infoTitle').textContent      = p.label;
  document.getElementById('infoSub').textContent        = p.info.sub;

  const body = document.getElementById('infoBody');
  body.innerHTML = '';

  const desc = mk('div', 'info-desc');
  desc.innerHTML = p.info.desc;
  body.appendChild(desc);

  if (p.info.events?.length) {
    body.appendChild(mk('div', 'sec-title', 'Date e eventi chiave'));
    const row = mk('div', 'events-row');
    p.info.events.forEach(ev => {
      const chip = mk('div', 'ev-chip');
      chip.innerHTML = `<span class="yr">${ev.yr}</span><span class="tx">${ev.tx}</span>`;
      row.appendChild(chip);
    });
    body.appendChild(row);
  }

  if (p.info.facts?.length) {
    body.appendChild(mk('div', 'sec-title', 'Lo sapevi?'));
    const list = mk('div', 'facts-list');
    p.info.facts.forEach(f => list.appendChild(mk('div', 'fact', f)));
    body.appendChild(list);
  }

  const panel = document.getElementById('info-panel');
  panel.classList.add('visible');
  setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('visible');
  document.getElementById('placeholder').classList.remove('hidden');
  if (active) { document.getElementById('p-' + active)?.classList.remove('active'); active = null; }
}

/* ══════════════════════════════════════════════
   DRAG-TO-SCROLL (desktop)
══════════════════════════════════════════════ */
function setupDrag() {
  const el = document.getElementById('tlOuter');
  let down = false, startX, sl;
  el.addEventListener('mousedown', e => { down = true; startX = e.pageX - el.offsetLeft; sl = el.scrollLeft; });
  el.addEventListener('mouseleave', () => down = false);
  el.addEventListener('mouseup',    () => down = false);
  el.addEventListener('mousemove',  e => {
    if (!down) return;
    e.preventDefault();
    el.scrollLeft = sl - (e.pageX - el.offsetLeft - startX) * 1.4;
  });
}

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
render();
setupDrag();

// Scroll to show ancient Rome area on load
window.addEventListener('load', () => {
  const outer = document.getElementById('tlOuter');
  // center on 200 AD (middle of Roman Empire)
  const target = x(200) - outer.clientWidth * 0.35;
  outer.scrollLeft = Math.max(0, target);
});
</script>
